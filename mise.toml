[tools]
# Node.js for Astro/Starlight docs
node = "24"  # LTS version

# Package manager for docs
pnpm = "10"  # Pinned to major version

[env]
# Ensure pnpm uses local node_modules
_.path = ["./node_modules/.bin"]

[tasks.test]
description = "Run unit tests then integration tests"
run = ["cargo test", "cargo test -- --ignored"]

[tasks.docs]
description = "Run the documentation dev server"
dir = "docs"
run = "npm run dev"

[tasks.cspawn]
description = "Build spawn and point ~/.cargo/bin/cspawn at the debug binary"
dir = "{{config_root}}"
run = [
  "cargo build",
  # A symlink rather than a copy: any later `cargo build`, from anywhere,
  # keeps cspawn current instead of silently leaving a stale snapshot.
  "ln -sf {{config_root}}/target/debug/spawn $HOME/.cargo/bin/cspawn",
  "$HOME/.cargo/bin/cspawn --version",
]
